name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Compile Python modules
        run: python -m compileall runtime scripts
      - name: Run pytest
        run: python -m pytest tests/ -q

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Check generated schemas match generator
        run: python scripts/generate_schemas_templates.py --check
      - name: Check generated workflows match generator
        run: python scripts/generate_workflows.py --check
      - name: Run capability map check
        run: python scripts/build_capability_map.py --check
      - name: Check generated provenance is consistent
        run: python scripts/audit_sources.py --check
      - name: Run RUP validation
        run: python scripts/validate_rup.py --schema protocol/rup-schema.json all .
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Ensure no uncommitted generated changes
        run: git diff --exit-code

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.8.5"
      - name: Install IaC security scanner
        run: |
          # tfsec (or checkov) powers the canonical iac_validator security
          # operation; install one so the gate executes instead of reporting
          # unavailable. Prefer checkov (pip package, no separate download).
          python -m pip install checkov==3.3.13
      - name: Generate Terraform baseline via the RUP runtime
        run: |
          python - <<'PYEOF'
          import subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from tests.forward.fixtures import build_fixture

          with tempfile.TemporaryDirectory() as td:
              target = Path(td) / "iac_repo"
              build_fixture("ops_workstreams", target)
              r = subprocess.run(
                  [sys.executable, "-m", "runtime.cli", "all", "--target", str(target),
                   "--sandbox", "off", "--override-escalation",
                   "--time-budget", "180", "--max-files", "30"],
                  capture_output=True, text=True,
              )
              main_tf = target / "terraform" / "main.tf"
              if not main_tf.exists():
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit("terraform/main.tf was not generated by the runtime")
              subprocess.run(["terraform", "init", "-backend=false", "-input=false"],
                             cwd=target / "terraform", check=True)
              subprocess.run(["terraform", "validate", "-no-color"],
                             cwd=target / "terraform", check=True)
              # The iac_scan gate must also pass end-to-end: it re-runs init +
              # validate and adds the checkov security operation.
              subprocess.run(["checkov", "-d", str(target / "terraform"),
                              "--framework", "terraform", "--quiet"], check=True)
              print("terraform init + validate + checkov OK")
          PYEOF

  pulumi-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Set up Pulumi
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58
        with:
          pulumi-version: "3.150.0"
      - name: Run lifecycle on the Pulumi fixture (iac_scan pulumi preview path)
        run: |
          python - <<'PYEOF'
          import os
          import subprocess
          import sys
          import tempfile
          import json
          from pathlib import Path
          sys.path.insert(0, ".")
          from tests.forward.fixtures import build_fixture

          with tempfile.TemporaryDirectory() as td:
              target = Path(td) / "pulumi_repo"
              build_fixture("pulumi_project", target)

              # The Pulumi fixture is a Python program that imports the pulumi
              # package and needs a backend + selected stack before preview.
              env = os.environ.copy()
              env["PULUMI_CONFIG_PASSPHRASE"] = ""
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "-r", str(target / "requirements.txt")],
                  check=True,
              )
              state_dir = target / ".pulumi-state"
              subprocess.run(
                  ["pulumi", "login", state_dir.resolve().as_uri()],
                  cwd=target,
                  env=env,
                  check=True,
              )
              subprocess.run(
                  ["pulumi", "stack", "init", "ci", "--non-interactive"],
                  cwd=target,
                  env=env,
                  check=True,
              )

              r = subprocess.run(
                  [sys.executable, "-m", "runtime.cli", "all", "--target", str(target),
                   "--sandbox", "off", "--override-escalation",
                   "--time-budget", "180", "--max-files", "30"],
                  env=env,
                  check=False,
                  capture_output=True,
              )
              verification_path = target / ".rup" / "RUP_VERIFICATION.json"
              if not verification_path.exists():
                  print(r.stdout.decode("utf-8", errors="replace"))
                  print(r.stderr.decode("utf-8", errors="replace"))
                  raise SystemExit("RUP lifecycle did not produce RUP_VERIFICATION.json")
              data = json.loads(verification_path.read_text())
              iac = data["audit_trail"][0]["details"]["gates"]["iac_scan"]
              preview = iac.get("operations", {}).get("pulumi_preview", {})
              if preview.get("executed") is not True:
                  raise SystemExit(f"pulumi_preview was not executed: {preview}")
              if preview.get("command_succeeded") is not True:
                  raise SystemExit(f"pulumi_preview command failed: {preview}")
              if preview.get("passed") is not True:
                  raise SystemExit(f"pulumi_preview gate did not pass: {preview}")
              print("iac_scan pulumi_preview gate OK")
          PYEOF

  required:
    if: always()
    needs: [test, integrity, terraform-validation, pulumi-validation]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.integrity.result }}" = "success"
          test "${{ needs.terraform-validation.result }}" = "success"
          test "${{ needs.pulumi-validation.result }}" = "success"
