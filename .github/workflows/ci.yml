name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    - name: Compile Python modules
      run: python -m compileall runtime scripts
    - name: Run pytest
      run: python -m pytest tests/ -q
    - name: Run Build Capability Map Check
      run: python scripts/build_capability_map.py --check
    - name: Run RUP Validation
      run: python scripts/validate_rup.py --schema protocol/rup-schema.json all .