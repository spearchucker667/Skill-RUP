name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Compile Python modules
        run: python -m compileall runtime scripts
      - name: Run pytest
        run: python -m pytest tests/ -q

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Check generated schemas match generator
        run: python scripts/generate_schemas_templates.py --check
      - name: Check generated workflows match generator
        run: python scripts/generate_workflows.py --check
      - name: Run capability map check
        run: python scripts/build_capability_map.py --check
      - name: Check generated provenance is consistent
        run: python scripts/audit_sources.py --check
      - name: Run RUP validation
        run: python scripts/validate_rup.py --schema protocol/rup-schema.json all .
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Ensure no uncommitted generated changes
        run: git diff --exit-code

  required:
    if: always()
    needs: [test, integrity]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.integrity.result }}" = "success"
