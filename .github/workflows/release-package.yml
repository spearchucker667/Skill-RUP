name: Release Package

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate release source
        run: |
          python -m pytest tests/ -q
          python scripts/generate_schemas_templates.py --check
          python scripts/generate_workflows.py --check
          python scripts/build_capability_map.py --check
          python scripts/audit_sources.py --check
          python scripts/validate_rup.py --schema protocol/rup-schema.json all .
          git diff --exit-code

      - name: Package skill
        id: package
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          PACKAGE_NAME="rup-skill-${TAG_NAME}.zip"
          python scripts/package_skill.py \
            --version "${VERSION}" \
            --output "dist/${PACKAGE_NAME}"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: |
          python scripts/package_skill.py \
            --verify \
            --output "dist/${{ steps.package.outputs.package_name }}"

      - name: Validate packaged skill
        run: |
          mkdir -p /tmp/skill-extract
          unzip -q "dist/${{ steps.package.outputs.package_name }}" \
            -d /tmp/skill-extract
          skills-ref validate /tmp/skill-extract/rup

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/${{ steps.package.outputs.package_name }}
            dist/${{ steps.package.outputs.package_name }}.sha256
