name: Release Package
on:
  release:
    types: [created]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Package Skill
      run: |
        # Dynamically derive package name from tag
        TAG_NAME=${{ github.ref_name }}
        PACKAGE_NAME="rup-skill-${TAG_NAME}.zip"
        python scripts/package_skill.py --version "${TAG_NAME}" --output "dist/${PACKAGE_NAME}"
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/rup-skill-${{ github.ref_name }}.zip
        asset_name: rup-skill-${{ github.ref_name }}.zip
        asset_content_type: application/zip