name: Release Package
on:
  release:
    types: [created]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    - name: Fail on dirty/generated drift
      run: |
        python scripts/build_capability_map.py --check
        git diff --exit-code -- provenance/capability-lineage.json docs/CAPABILITY_MAPPING.md || {
          echo "Generated capability mapping is out of date; regenerate and commit.";
          exit 1;
        }
    - name: Package Skill
      id: package
      run: |
        TAG_NAME="${{ github.ref_name }}"
        VERSION="${TAG_NAME#v}"
        PACKAGE_NAME="rup-skill-${TAG_NAME}.zip"
        python scripts/package_skill.py --version "${VERSION}" --output "dist/${PACKAGE_NAME}"
        echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
    - name: Verify package manifest and hashes
      run: |
        python scripts/package_skill.py --verify --output "dist/${{ steps.package.outputs.package_name }}"
    - name: Validate extracted Agent Skills package
      run: |
        mkdir -p /tmp/skill-extract
        unzip -q "dist/${{ steps.package.outputs.package_name }}" -d /tmp/skill-extract
        skills-ref validate "/tmp/skill-extract/rup"
    - name: Generate release checksums
      run: |
        cd dist
        sha256sum "${{ steps.package.outputs.package_name }}" > "${{ steps.package.outputs.package_name }}.sha256"
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      permissions:
        contents: write
      with:
        files: |
          dist/${{ steps.package.outputs.package_name }}
          dist/${{ steps.package.outputs.package_name }}.sha256
