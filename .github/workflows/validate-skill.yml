name: Validate Skill
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run validate_rup.py
        run: python scripts/validate_rup.py --schema protocol/rup-schema.json all .
      - name: Check progressive-disclosure references
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          # Strip YAML front matter before scanning Markdown body.
          if skill.startswith("---"):
              _, _, body = skill.partition("---")
              skill = body

          missing = []
          # Match both Markdown links [text](path) and bare path mentions.
          patterns = [
              re.compile(r"\]\((workflows/[^)]+)\)"),
              re.compile(r"\]\((references/[^)]+)\)"),
              re.compile(r"(?<![\](])\b(workflows/[\w/.-]+\.md)"),
              re.compile(r"(?<![\](])\b(references/[\w/.-]+\.md)"),
          ]
          seen = set()
          for pat in patterns:
              for m in pat.findall(skill):
                  if m in seen:
                      continue
                  seen.add(m)
                  if not Path(m).exists():
                      missing.append(m)

          if missing:
              print("SKILL.md references missing paths:", file=sys.stderr)
              for m in missing:
                  print(f"  - {m}", file=sys.stderr)
              sys.exit(1)
          print("All SKILL.md progressive-disclosure references exist.")
          PY
      - name: Package skill
        run: python scripts/package_skill.py --version 3.0.0 --output dist/rup-skill-v3.0.0.zip
      - name: Verify package
        run: python scripts/package_skill.py --verify --output dist/rup-skill-v3.0.0.zip
      - name: Validate packaged skill
        run: |
          mkdir -p /tmp/skill-extract
          unzip -q dist/rup-skill-v3.0.0.zip -d /tmp/skill-extract
          skills-ref validate /tmp/skill-extract/rup
